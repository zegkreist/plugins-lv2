name: build

# Every push / PR: build and test on x86_64 and arm64.
# Pushing a tag like v0.1.0 also publishes a GitHub Release with the binaries.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 = older glibc, so the binaries also run on older distros
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config lv2-dev

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Package
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || version="dev-${GITHUB_SHA::7}"
          scripts/package.sh "$version" "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            ## Install

            Download the `.tar.gz` for your machine (`x86_64` = regular PC, `arm64` = Raspberry Pi 4/5 and other ARM boards) and extract it into `~/.lv2`:

            ```bash
            mkdir -p ~/.lv2
            tar -xzf plugins-lv2-${{ github.ref_name }}-linux-x86_64.tar.gz -C ~/.lv2
            ```

            Then rescan plugins in your host (Carla, Ardour, Reaper...).
